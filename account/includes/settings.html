<h2 id="title-header">Account settings</h2>
<div id="input-container">
    <div id="input-wrapper">
        <p>Display Name</p>
        <input id="username" type="text" value="User">
        <p>Assistant Name</p>
        <input id="assistant-name" type="text" value="Assistant">
        <p>Model</p>
        <select id="model-select">
            <option value="">Select model</option>
            <script type="text/javascript">
                const select = document.getElementById('model-select');

                const options = {
                    method: 'GET',
                    "Content-Type": "application/json",
                }

                // Fetch all models
                fetch(`${window.config.api.ollamaUrl}/api/tags`, options)
                    .then(res => res.json())
                    .then(data => {
                        // Iterate through the models
                        for (const model of data.models) {
                            // Add an element for each model
                            select.innerHTML += `<option value="${model.name}">${model.name}</option>`;
                        }
                    })
                    .catch(err => console.log(err));

            </script>
        </select>
        <p>Email address</p>
        <input id="email" type="email" value="mail@example.com">
    </div>
</div>

<style>
    #title-header {
        font-size: 2rem;
    }

    #input-wrapper {
        width: 80%;
        text-align: left;
        margin: auto;
    }

    #input-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        width: 70%;
        height: auto;
        overflow: hidden;
        border: 1px solid #ccc;
        padding: 5% 0 5% 0;
        border-radius: 5px;
        box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.5), inset 0 0 50px rgba(229, 101, 255, 0.2);
        backdrop-filter: blur(20px);

        input, button, select {
            width: 100%;
            height: 3rem;
            padding: 10px;
            margin: 5px 0 5px 0;
            box-sizing: border-box;
            text-align: center;
            background: transparent;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            color: #fff;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5), inset 0 0 20px rgba(91, 240, 255, 0.2);
            backdrop-filter: blur(20px);
            font-weight: bold;
        }

        input:focus, button:focus {
            outline: none;
        }
    }
</style>
