<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
    <style>
        rect {
            x: 2px;
            y: 2px;
            width: calc(100% - 4px);
            height: calc(100% - 4px);
            rx: 8px;
            ry: 8px;
            fill: none;
            stroke: #4ade80;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 10 14;
        }
    </style>
    <rect/>
</svg>
